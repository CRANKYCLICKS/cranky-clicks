<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cranky Clicks photography library — portraits, street and travel.">
<meta name="theme-color" content="#050505"><title>Library — Cranky Clicks</title>
<style>
:root{--bg:#050505;--text:#f2f2ee;--muted:#95958e;--line:rgba(255,255,255,.1);--max:1400px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:18px}.navin{max-width:var(--max);margin:auto;display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(5,5,5,.78);backdrop-filter:blur(18px)}.brand{font-size:.75rem;font-weight:750;letter-spacing:.18em;text-transform:uppercase}.links{display:flex;gap:5px}.links a{padding:9px 12px;border-radius:999px;color:#a7a79f;font-size:.75rem}.links a:hover{color:#fff;background:rgba(255,255,255,.06)}.page{max-width:var(--max);margin:auto;padding:145px 28px 80px}.top{display:flex;align-items:end;justify-content:space-between;gap:35px}.k{color:#73736b;font-size:.64rem;text-transform:uppercase;letter-spacing:.23em}.top h1{margin:12px 0 0;font-size:clamp(4.2rem,12vw,10rem);line-height:.78;letter-spacing:-.085em;max-width:8ch}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:45px 0 24px}.f{padding:9px 13px;border-radius:999px;border:1px solid var(--line);color:#85857d;background:transparent;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase}.f.active,.f:hover{background:rgba(255,255,255,.08);color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{grid-column:span 4;position:relative;min-height:450px;overflow:hidden;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:#0b0b0b;cursor:pointer;padding:0}.card.wide{grid-column:span 8;min-height:590px}.card.tall{min-height:590px}.card img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .7s}.card:before{content:"CRANKY CLICKS";position:absolute;z-index:3;right:15px;bottom:14px;color:rgba(255,255,255,.95);font-size:.58rem;font-weight:600;letter-spacing:.16em;line-height:1;text-transform:uppercase;opacity:.35;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.55)}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 44%,rgba(0,0,0,.85));pointer-events:none}.card:hover img{transform:scale(1.06);filter:saturate(1.06)}.meta{position:absolute;z-index:2;left:19px;right:19px;bottom:18px;display:flex;justify-content:space-between;align-items:end}.name{font-size:1.1rem}.type{margin-top:3px;color:#87877f;font-size:.64rem;text-transform:uppercase;letter-spacing:.12em}.idx{color:#77776f;font-size:.65rem}.lightbox{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:rgba(8,8,8,.42);opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;backdrop-filter:blur(10px) saturate(.82);-webkit-backdrop-filter:blur(10px) saturate(.82)}.lightbox.open{opacity:1;visibility:visible}.box{width:min(1240px,100%);display:flex;align-items:center;justify-content:center;gap:16px}.frame{position:relative;flex:1;min-width:0;border:1px solid rgba(255,255,255,.18);border-radius:18px;overflow:hidden;background:rgba(10,10,10,.3);backdrop-filter:blur(18px);box-shadow:0 25px 90px rgba(0,0,0,.35)}.frame img{display:block;width:100%;height:min(78vh,850px);object-fit:contain}.frame:after{content:"CRANKY CLICKS";position:absolute;right:20px;bottom:18px;color:rgba(255,255,255,.92);font-size:.62rem;font-weight:650;letter-spacing:.19em;text-transform:uppercase;opacity:.42;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.75)}.caption-panel{flex:0 0 225px;padding:22px 20px;border:1px solid rgba(255,255,255,.16);border-radius:17px;background:rgba(22,22,22,.38);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 60px rgba(0,0,0,.18)}.caption-k{margin-bottom:13px;color:#aaa99f;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase}.caption-panel h2{margin:0 0 10px;font-size:1.1rem;line-height:1.15;letter-spacing:-.035em}.caption-panel p{margin:0;color:rgba(242,242,238,.72);font-size:.78rem;line-height:1.65}.close{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(12,12,12,.55);color:#fff;z-index:2;backdrop-filter:blur(14px)}.foot{max-width:var(--max);margin:auto;padding:0 28px 40px;color:#62625c;font-size:.7rem}@media(max-width:900px){.top{display:block}.card,.card.wide,.card.tall{grid-column:span 6;min-height:440px}}@media(max-width:760px){.lightbox{padding:14px}.box{flex-direction:column;gap:10px;max-height:calc(100vh - 28px);overflow-y:auto;justify-content:flex-start}.frame{flex:0 0 auto;width:100%}.frame img{height:min(62vh,650px)}.caption-panel{flex:0 0 auto;width:100%;padding:15px 17px}.caption-panel p{font-size:.75rem}.frame:after{right:14px;bottom:13px;font-size:.55rem}}@media(max-width:620px){.nav{padding:12px}.links{display:none}.page{padding:125px 18px 70px}.grid{grid-template-columns:1fr}.card,.card.wide,.card.tall{grid-column:1;min-height:430px}.card.wide{min-height:470px}}
</style>
</head>
<body>
<header class="nav"><div class="navin"><a class="brand" href="index.html">CRANKY CLICKS</a><nav class="links"><a href="index.html">Home</a><a href="library.html">Library</a><a href="about.html">About</a></nav></div></header>
<main class="page">
<div class="top"><div><div class="k">The library</div><h1>Frames<br>worth keeping.</h1></div></div>
<div class="filters"><button class="f active" data-filter="all">All</button><button class="f" data-filter="portrait">Portraits</button><button class="f" data-filter="nature">Nature</button><button class="f" data-filter="animals">Animals</button><button class="f" data-filter="birds">Birds</button><button class="f" data-filter="street">Street</button><button class="f" data-filter="travel">Travel</button></div>
<div class="grid">
<button class="card wide" data-cat="nature" data-title="Open Landscapes" data-description="Wide landscapes, natural light and quiet spaces that let the scenery speak for itself."><img loading="lazy" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=88" alt="Mountain landscape surrounded by nature"></button>
<button class="card tall" data-cat="portrait" data-title="Quiet Portrait" data-description="Portraits focused on expression, character and the small details that make each person unique."><img loading="lazy" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=88" alt="Portrait"></button>
<button class="card" data-cat="street" data-title="City in Motion" data-description="Street scenes shaped by architecture, movement and the atmosphere of everyday city life."><img loading="lazy" src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1200&q=88" alt="Moody city street"></button>
<button class="card wide" data-cat="travel" data-title="Roads & Horizons" data-description="Travel photography that holds onto the feeling of being somewhere new and looking a little longer."><img loading="lazy" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=88" alt="Mountain landscape"></button>
<button class="card" data-cat="portrait" data-title="Low-Light Portrait" data-description="A study of shadow, texture and natural expression, with light doing as much storytelling as the subject."><img loading="lazy" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=88" alt="Portrait in low light"></button>
<button class="card tall" data-cat="street" data-title="Night Shift" data-description="Urban lights and nighttime architecture captured with a cinematic, moody feel."><img loading="lazy" src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1200&q=88" alt="City skyline at night"></button>
<button class="card tall" data-cat="animals" data-title="A Moment with Nature" data-description="Animal photography that brings attention to personality, presence and small candid moments."><img loading="lazy" src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=88" alt="Dog photographed outdoors"></button>
<button class="card" data-cat="birds" data-title="Birdlife" data-description="A quiet look at birds in their natural surroundings, celebrating detail, patience and the outdoors."><img loading="lazy" src="https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=1200&q=88" alt="Bird perched in nature"></button>
</div>
</main>
<footer class="foot">© <span id="year"></span> Cranky Clicks · <a href="index.html">Home</a> · <a href="about.html">About</a></footer>
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photograph preview"><div class="box"><div class="frame"><button class="close" id="close" type="button" aria-label="Close">×</button><img id="lbimg" alt=""></div><aside class="caption-panel"><div class="caption-k">Cranky Clicks / Image notes</div><h2 id="lbtitle">Photograph</h2><p id="lbdesc">A closer look at the moment.</p></aside></div></div>
<script>
const fs=[...document.querySelectorAll(".f")],cards=[...document.querySelectorAll(".card")],lb=document.getElementById("lightbox"),img=document.getElementById("lbimg"),title=document.getElementById("lbtitle"),desc=document.getElementById("lbdesc"),close=document.getElementById("close");
fs.forEach(b=>b.addEventListener("click",()=>{fs.forEach(x=>x.classList.remove("active"));b.classList.add("active");const f=b.dataset.filter;cards.forEach(c=>c.style.display=f==="all"||c.dataset.cat===f?"block":"none")}));
cards.forEach(c=>c.addEventListener("click",()=>{const i=c.querySelector("img");img.src=i.currentSrc||i.src;img.alt=i.alt;title.textContent=c.dataset.title||i.alt||"Photograph";desc.textContent=c.dataset.description||i.alt||"A moment captured by Cranky Clicks.";lb.classList.add("open");lb.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";close.focus()}));function hide(){lb.classList.remove("open");lb.setAttribute("aria-hidden","true");img.src="";document.body.style.overflow=""}close.addEventListener("click",hide);lb.addEventListener("click",e=>{if(e.target===lb)hide()});document.addEventListener("keydown",e=>{if(e.key==="Escape")hide()});document.getElementById("year").textContent=new Date().getFullYear();
</script>
</body>
</html>
